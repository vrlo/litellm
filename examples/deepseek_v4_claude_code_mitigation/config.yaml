model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: azure_ai/DeepSeek-V4-Flash
      api_base: https://cody-io-eu.services.ai.azure.com
      api_key: os.environ/AZURE_AI_API_KEY
      # reasoning_effort is unsupported by this Flash deployment. The raw
      # Anthropic keys are inert after translation but document the boundary.
      additional_drop_params:
        - reasoning_effort
        - thinking
        - output_config
  - model_name: deepseek-v4-flash-0731
    litellm_params:
      model: azure_ai/DeepSeek-V4-Flash-0731
      api_base: https://cody-io-eu.services.ai.azure.com
      api_key: os.environ/AZURE_AI_API_KEY
      # reasoning_effort is unsupported by this Flash deployment. The raw
      # Anthropic keys are inert after translation but document the boundary.
      additional_drop_params:
        - reasoning_effort
        - thinking
        - output_config

litellm_settings:
  callbacks: examples.deepseek_v4_claude_code_mitigation.callback.deepseek_v4_claude_code_mitigation
